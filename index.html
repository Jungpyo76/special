<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영상 보기</title>
<style>
  :root { --bg:#111; --fg:#f5f5f5; --muted:#aaa; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--fg);
         font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
         display:flex; flex-direction:column; align-items:center; justify-content:center; padding:16px; }
  h1 { font-size:1.2rem; margin:0 0 12px; text-align:center; }
  .player { width:100%; max-width:960px; aspect-ratio:16/9; background:#000; border-radius:8px; overflow:hidden; }
  .player iframe, .player video { width:100%; height:100%; border:0; display:block; }
  .msg { color:var(--muted); text-align:center; padding:24px; }
  a { color:#8ab4f8; }
</style>
</head>
<body>
  <h1 id="title">불러오는 중…</h1>
  <div class="player" id="player"></div>
  <p class="msg" id="msg"></p>
<script>
// video.json 의 url 만 바꾸면 QR은 그대로, 재생되는 영상만 바뀝니다.
function embed(url) {
  let m;
  // YouTube
  if ((m = url.match(/(?:youtube\.com\/(?:watch\?v=|shorts\/|embed\/|live\/)|youtu\.be\/)([\w-]{11})/)))
    return { type:'iframe', src:`https://www.youtube.com/embed/${m[1]}?autoplay=1&mute=1&playsinline=1&rel=0` };
  // Google Drive
  if ((m = url.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?.*id=)([\w-]+)/)))
    return { type:'iframe', src:`https://drive.google.com/file/d/${m[1]}/preview` };
  // Vimeo
  if ((m = url.match(/vimeo\.com\/(?:video\/)?(\d+)/)))
    return { type:'iframe', src:`https://player.vimeo.com/video/${m[1]}?autoplay=1&muted=1` };
  // mp4/webm 등 직접 파일 (예: videos/clip.mp4)
  return { type:'video', src:url };
}

(async () => {
  const player = document.getElementById('player');
  const msg = document.getElementById('msg');
  try {
    const res = await fetch('video.json?t=' + Date.now(), { cache:'no-store' });
    const cfg = await res.json();
    document.title = cfg.title || '영상 보기';
    document.getElementById('title').textContent = cfg.title || '';
    const e = embed(cfg.url.trim());
    if (e.type === 'iframe') {
      const f = document.createElement('iframe');
      f.src = e.src;
      f.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
      f.allowFullscreen = true;
      player.appendChild(f);
    } else {
      const v = document.createElement('video');
      v.src = e.src; v.controls = true; v.playsInline = true; v.autoplay = true; v.muted = true;
      player.appendChild(v);
    }
  } catch (err) {
    document.getElementById('title').textContent = '';
    player.remove();
    msg.textContent = '영상을 불러오지 못했습니다. video.json 을 확인하세요.';
  }
})();
</script>
</body>
</html>
